# Judge0 configuration — local dev, self-hosted (CEX container).
# This runs untrusted student code, so every limit here is deliberately
# conservative. Do not relax without re-reviewing the security implications.
#
# CREDENTIALS BELOW ARE HARDCODED DEV-ONLY VALUES (#137). Judge0's flat
# key=value .conf format has no variable substitution, so unlike
# docker-compose.yml's ${VAR:?...} pattern (used for POSTGRES_PASSWORD,
# JWT_SIGNING_KEY, OPENFGA_PRESHARED_KEY there), these can't fail-fast on a
# missing env var without extra templating machinery this file doesn't have.
# Mitigated today by being internal-only (no host-published port reaches
# judge0-db/judge0-redis/judge0-server's AUTHN_TOKEN check — see
# docker-compose.yml), but that is NOT a substitute for rotation.
# MUST BE ROTATED — together with the matching values in docker-compose.yml's
# judge0-db/judge0-redis services, which currently hardcode the same values —
# before any non-dev deploy.

# --- Datastore ---
POSTGRES_HOST=judge0-db
POSTGRES_PORT=5432
POSTGRES_DB=judge0
POSTGRES_USER=judge0
POSTGRES_PASSWORD=judge0_dev

REDIS_HOST=judge0-redis
REDIS_PORT=6379
REDIS_PASSWORD=judge0_redis_dev

# --- Resource ceilings per submission (hard caps, not defaults) ---
MAX_CPU_TIME_LIMIT=15
MAX_CPU_EXTRA_TIME=5
MAX_WALL_TIME_LIMIT=20
MAX_MEMORY_LIMIT=256000
MAX_STACK_LIMIT=64000
MAX_PROCESSES_AND_OR_THREADS=60
MAX_FILE_SIZE=4096
MAX_NUMBER_OF_RUNS=20

# --- Network isolation ---
# SECURITY-LOAD-BEARING (#95): submitted code must never reach the network —
# no exfiltration, no calling out to other containers/services from inside a
# submission. This is one of the mitigations docker-compose.yml's judge0-server
# / judge0-workers rely on to justify running `privileged: true`. Do NOT flip
# either setting to `true` "temporarily for debugging" and forget to revert —
# combined with the containers' host privileges, that turns an isolate sandbox
# escape into direct network access from inside untrusted student code.
ENABLE_NETWORK=false
ALLOW_ENABLE_NETWORK=false

# --- Queueing / throughput guards ---
MAX_QUEUE_SIZE=100
INTERVAL=0.1
COUNT=1

# --- Auth: this is internal-only (called by backend-api on the Docker
# network, never exposed directly to students), but require a token
# anyway so a compromised container on the same network can't submit
# arbitrary code for execution without it.
AUTHN_HEADER=X-Judge0-Auth
AUTHN_TOKEN=dev-only-judge0-token-change-me

ENABLE_WAIT_RESULT=true
ENABLE_COMPILER_OPTIONS=false
ALLOWED_LANGUAGES_FOR_COMPILE_OPTIONS=
ENABLE_COMMAND_LINE_ARGUMENTS=false
ENABLE_SUBMISSION_DELETE=false

# --- Fork-safety (found while wiring SEK-01's Code Execution Service consumer) ---
# The redis-rb client this image ships is not fork-safe: judge0-server's Puma defaults to
# cluster mode (pre-forked worker processes — even RAILS_SERVER_PROCESSES=1 still forks
# once from the master), and the inherited Redis TCP connection breaks in the forked
# child (Redis::CannotConnectError on every submission), even though Redis itself is
# reachable and the credentials are correct. RAILS_SERVER_PROCESSES=0 puts Puma in true
# single-process mode (no fork at all — confirmed via this image's own boot log: "Puma
# starting in single mode...") and fixes judge0-server's /submissions endpoint: it now
# accepts a job and returns 201 instead of 500.
# FORK_PER_JOB=false is Resque's equivalent knob for judge0-workers, but did NOT fully
# resolve worker-side job pickup in this environment as of this writing — queued
# submissions can still sit at status "In Queue" indefinitely, and judge0-workers' own
# ./scripts/workers startup wrapper appears to hit a similar Redis-connection problem at
# its own heartbeat-registration step (a different code path than the per-job fork this
# variable controls). Left set since it's still correct and harmless, but treat
# judge0-workers as not-yet-fully-verified in this Docker Desktop/WSL2 environment —
# needs follow-up (possibly a cgroup/isolate sandboxing limitation on this host) before
# relying on it for real submissions.
RAILS_SERVER_PROCESSES=0
FORK_PER_JOB=false

# --- judge0-workers follow-up (2026-07-27): fork theory ruled out, root cause still
# unknown ---
# Went further on the "needs follow-up" item above. The failure is
# Redis::CannotConnectError / SocketError: getaddrinfo: Name or service not known,
# raised specifically from Resque::Worker#start_heartbeat -> #remove_heartbeat
# (worker.rb:475/507) — i.e. right at worker startup, every time, in this environment.
# Ruled out, each confirmed live via `docker exec`:
#   - NOT DNS: `judge0-redis` resolves fine (`getent hosts`, and Ruby's own
#     `Socket.getaddrinfo('judge0-redis', ...)` succeeds every time in the same
#     container).
#   - NOT hostname-vs-IP: pointed REDIS_HOST at judge0-redis's literal container IP
#     (via a pinned docker-compose static address) — identical failure, same
#     getaddrinfo error text, even though a numeric IP shouldn't need resolution.
#   - NOT network/TCP reachability: `ping` and a raw TCP PING (bash /dev/tcp, actually
#     sending the Redis wire protocol, not just waiting for unsolicited data) both
#     succeed against judge0-redis from inside judge0-workers.
#   - NOT the redis gem or fork-safety in general: a bare `ruby -e "Redis.new(host:
#     ENV['REDIS_HOST'], ...).ping"` inside judge0-workers succeeds every time,
#     including immediately after a fresh `docker restart`. This is the exact same
#     Redis.new(...) shape config/initializers/resque.rb uses.
#   - NOT specifically the `resque:workers` (plural) task's `system("rake
#     resque:work")` fork — the *singular* `rails resque:work` task (no fork, no
#     Thread, no system() call) fails identically.
# So it's isolated to something inside Resque::Worker's own startup/heartbeat call
# path specifically (worker.rb's start_heartbeat -> remove_heartbeat -> the
# Redis::Namespace-wrapped `hdel` call) that a bare `Redis.new(...).ping` doesn't
# exercise — not DNS, not networking, not IP-vs-hostname, not forking in general.
# Reverted the static-IP compose change (it didn't help and added unnecessary
# topology complexity) rather than leave a fix in place that doesn't fix anything.
# Next things worth trying, not yet attempted: bisect exactly which Resque/
# redis-namespace call inside start_heartbeat's chain throws (add instrumentation
# directly in the gem, or monkey-patch a wrapper with rescue+reraise for a real
# backtrace with local state); try a newer `redis`/`redis-namespace` gem version
# pinned into the image; or a newer Judge0 image entirely if one exists with an
# updated Ruby/gem stack.

# --- RESOLVED (2026-07-30): the Redis heartbeat mystery above was two separate,
# unrelated bugs, both now understood and (partially) fixed ---
#
# Bug 1 — FIXED: this file had Windows CRLF line endings on disk (a git-checkout
# artifact, not something in the repo's actual history). Judge0's own baked-in image
# entrypoint re-sources /judge0.conf directly via bash (separately from, and in
# addition to, docker-compose.yml's own clean `env_file:` mechanism — which is why a
# fresh `docker exec ... env` always looked clean and threw the prior investigation
# off). Bash's `source` on a CRLF file leaves a trailing `\r` attached to every
# value, so the *actual running Rails/Resque process* had REDIS_HOST =
# "judge0-redis\r" — confirmed directly by monkey-patching
# resque-2.0.0/lib/resque/data_store.rb#remove_heartbeat to print the live Redis
# client's `.host` and its raw bytes (host_bytes ended in `13`, i.e. \r). A
# getaddrinfo() call on "judge0-redis\r" fails with exactly the observed
# `SocketError: getaddrinfo: Name or service not known` — every "not DNS, not
# networking, not IP-vs-hostname" elimination in the investigation above was
# correct, because all of those tests used a clean literal string, never the
# actual corrupted ENV value. Converting this file to LF-only line endings (`sed -i
# 's/\r$//'`) fully resolves it — verified via the same monkey-patch, which then
# printed a clean host="judge0-redis" and the worker no longer crashed at startup.
#
# Bug 2 — separate, transient, workaround documented (not a config fix): even with
# the CRLF fix, `judge0-db`'s Compose *service-name* DNS alias (as opposed to its
# container_name, which always resolved fine) intermittently failed to resolve from
# sibling containers on this Docker Desktop/WSL2 host — a Docker embedded-DNS
# (127.0.0.11) registration flake, not specific to Judge0. `docker restart
# judge0-db` alone did not fix it; a full `docker compose down` + `up -d` of the
# whole judge0-* subset (recreating the network from scratch) did. If this
# resurfaces, that's the fix — not another judge0.conf change.
#
# With both fixed, worker job pickup was confirmed genuinely working end-to-end: a
# real submission via POST /submissions?wait=true left "In Queue" and returned a
# real terminal status. HOWEVER, that status was `Internal Error` —
# `Failed to create control group /sys/fs/cgroup/memory/box-5/: No such file or
# directory`, i.e. isolate's actual sandboxing step. Direct verification on this
# host: `mount | grep cgroup` shows ONLY `cgroup2` mounted at /sys/fs/cgroup, no v1
# hierarchy anywhere (no hybrid mode) — independently reconfirming, with hard
# evidence this time, the cgroup v1 requirement already documented at the top of
# this file. This is a property of the WSL2 kernel Docker Desktop uses, not
# something a Judge0/isolate config or image swap fixes from this side.
#
# Per the plan's own next-candidate step: Piston (ghcr.io/engineer-man/piston) was
# tried on this exact host as the next remote-execution candidate. It does NOT use
# isolate/cgroup v1 — `docker run --privileged -v piston-data:/piston
# ghcr.io/engineer-man/piston` started cleanly ("Initialized cgroup", no error),
# installing python-3.12.0 via its package API succeeded, and a real submission via
# POST /api/v2/execute returned `{"stdout":"hello-piston\n","code":0,...}` — genuine
# end-to-end success on the same cgroup v2 host Judge0 cannot run on.
#
# CONCLUSION / GO-NO-GO: Judge0 itself stays a no-go for self-hosting on this class
# of host (WSL2/Docker Desktop, cgroup v2-only) — the isolate dependency is a real,
# unfixable-from-here constraint, now confirmed twice over. Piston is a GO: build
# the remote-execution fallback (Work Item B1) against Piston's API instead of
# Judge0's. The CRLF fix above is still worth keeping/landing regardless — it's a
# real bug in a real file, independent of which execution backend ships.
