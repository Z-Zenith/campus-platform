services:
  postgres:
    image: postgres:16-alpine
    container_name: campus-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: campus
      POSTGRES_USER: campus
      # Required — no default. Mirrors the JWT_SIGNING_KEY fail-fast pattern
      # below: set POSTGRES_PASSWORD in the shell/.env before `docker compose
      # up` (see .env.example). Also read by campus-backend's
      # db/init/03_create_app_role.sh (sibling clone, mounted below) to
      # provision the least-privilege campus_app role (#137).
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD before starting postgres}
      # Dev-only default documented in .env.example; rotate before any
      # non-dev deploy. See ../campus-backend/db/init/03_create_app_role.sh (#137).
      POSTGRES_APP_PASSWORD: ${POSTGRES_APP_PASSWORD:-campus_app_dev}
    ports:
      - "5432:5432"
    volumes:
      - campus-pg-data:/var/lib/postgresql/data
      # db/init lives in campus-backend post-split (repo-split-plan.md §2 Tier 1:
      # `campus-backend` = `services/backend-api/` + `db/`) — sibling clone, per
      # INTEGRATIONS.md's bootstrap flow.
      - ../campus-backend/db/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U campus -d campus"]
      interval: 5s
      timeout: 5s
      retries: 10
  ai-services:
    build:
      # Sibling clone of campus-ai-services, per INTEGRATIONS.md's bootstrap flow
      # (repo-split-plan.md §2 Tier 1) — not a subdirectory of this repo.
      context: ../campus-ai-services
      dockerfile: Dockerfile
      target: runner
    container_name: campus-ai-services
    restart: unless-stopped
    ports:
      - "8000:8000"
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request; urllib.request.urlopen('http://localhost:8000/')\""]
      interval: 10s
      timeout: 5s
      retries: 5
    # Defense-in-depth container ceiling (#138) — not sized for a specific
    # model workload, just a backstop against one runaway process consuming
    # the whole host. Raise if a real model-serving workload needs more.
    mem_limit: 1g
    cpus: 1.0
    pids_limit: 256

  # Dev/CI-only image with pytest + tests/ baked in — not used at runtime.
  # Run tests with: docker compose run --rm ai-services-test pytest
  ai-services-test:
    build:
      context: ../campus-ai-services
      dockerfile: Dockerfile
      target: test
    profiles: ["test"]

  backend-api:
    build:
      # Sibling clone of campus-backend, per INTEGRATIONS.md's bootstrap flow
      # (repo-split-plan.md §2 Tier 1) — not a subdirectory of this repo.
      context: ../campus-backend
    container_name: campus-backend-api
    restart: unless-stopped
    environment:
      # Local dev only — enables DevSeedHostedService (bootstrap admin/student accounts) and
      # /openapi. Never set this in a real deployment.
      ASPNETCORE_ENVIRONMENT: Development
      # Cut over to the least-privilege campus_app role (#137) provisioned by
      # campus-backend's db/init/03_create_app_role.sh (sibling clone, mounted
      # into the postgres service above at ../campus-backend/db/init) instead
      # of the campus superuser — backend-api only ever does row-level CRUD,
      # never DDL/role/database administration. POSTGRES_APP_PASSWORD is
      # required (see postgres service above) and reused here so the two never
      # drift. Program.cs also fails fast outside Development if this still
      # resolves to the committed appsettings.json dev placeholder.
      ConnectionStrings__Campus: "Host=postgres;Port=5432;Database=campus;Username=campus_app;Password=${POSTGRES_APP_PASSWORD:-campus_app_dev}"
      # Required in non-Development environments — backend-api fails fast at startup if unset.
      # Set JWT_SIGNING_KEY in the shell/.env before `docker compose up`; never commit a real value.
      Jwt__Key: ${JWT_SIGNING_KEY:?Set JWT_SIGNING_KEY before starting backend-api}
      AiServices__BaseUrl: "http://ai-services:8000"
      # B1 remote-execution fallback (SDA/SEK plan) — RemoteCodeRunner talks to this only
      # when ContainerCodeRunner (the primary, Docker/Podman-backed) reports no local
      # runtime or an infra failure. See PistonClient.cs's doc comment for why Piston,
      # not judge0-server below, is what's actually wired in as of the 0.1 spike.
      Piston__BaseUrl: "http://piston:2000"
      # AIS-02: Copyleaks credentials — sourced from the host/CI environment (or a
      # gitignored .env file), never hardcoded here. Left unset, backend-api's
      # plagiarism-check endpoint fails closed with a 503 rather than crashing.
      Copyleaks__Email: "${COPYLEAKS_EMAIL:-}"
      Copyleaks__ApiKey: "${COPYLEAKS_API_KEY:-}"
      Copyleaks__WebhookSecret: "${COPYLEAKS_WEBHOOK_SECRET:-}"
      # AIS-05: Pangram credentials — same fail-closed-503 pattern as Copyleaks above.
      Pangram__ApiKey: "${PANGRAM_API_KEY:-}"
      # SEK-01 Docker-outside-of-Docker (see campus-backend/Services/DockerCodeRunner.cs and
      # docker-entrypoint.sh): `docker run -v` below is resolved by the HOST daemon (reached
      # over the bind-mounted socket), so DockerCodeRunner needs the actual host-filesystem
      # path of the coderun-tmp bind mount below, not its own container-side view of it
      # (/coderun-tmp) — the two only coincide when this process runs on the host directly
      # (bare `dotnet run`), which is why this is required only for the containerized
      # deployment, not a hardcoded default. Set to this compose file's directory + /coderun-tmp,
      # e.g. (from campus-platform/) on Linux/macOS: CODERUN_HOST_TEMP_DIR="$(pwd)/coderun-tmp";
      # on Windows: an absolute path Docker Desktop resolves bind-mount sources against (test it
      # actually works before relying on it — Docker Desktop's host-path resolution varies by
      # backend/version).
      CodeRunner__HostTempDir: ${CODERUN_HOST_TEMP_DIR:?Set CODERUN_HOST_TEMP_DIR (this compose file's directory + /coderun-tmp, as an absolute host path) before starting a containerized backend-api that needs to run student code}
    ports:
      - "8080:8080"
    volumes:
      # #131: Data Protection key ring (encrypts TOTP secrets at rest). Must persist across
      # restarts/redeploys — without this, every existing user's TotpSecret would become
      # undecryptable (and thus unusable for login) the moment the container is recreated.
      - campus-backend-keys:/keys
      # Docker-outside-of-Docker (see CodeRunner__HostTempDir above and docker-entrypoint.sh):
      # grants backend-api's docker CLI access to the HOST's daemon. This is host-root-
      # equivalent access — anything that can reach this socket can run an unsandboxed
      # container with an arbitrary bind mount, which is as good as root on the host. That
      # tradeoff is what makes running backend-api containerized (vs. this repo's documented
      # default of a bare `dotnet run`, see campus-backend/CLAUDE.md) a deliberate decision,
      # not a default one — see DockerCodeRunner.cs's doc comment for the fuller rationale.
      - /var/run/docker.sock:/var/run/docker.sock
      # Shared workdir for code submissions — must be the same directory on both sides of the
      # DooD boundary (see CodeRunner__HostTempDir above): this container writes a submission's
      # files here at /coderun-tmp/<id>, then asks the HOST daemon to bind-mount
      # {CODERUN_HOST_TEMP_DIR}/<id> (the same directory, seen from the host's own path) into
      # the sibling per-submission container it starts.
      - ./coderun-tmp:/coderun-tmp
    depends_on:
      postgres:
        condition: service_healthy
      authz:
        condition: service_healthy
      ai-services:
        condition: service_healthy
      piston:
        condition: service_started
    # Defense-in-depth container ceiling (#138).
    mem_limit: 1g
    cpus: 1.0
    pids_limit: 256

  # B1 remote-execution fallback (SDA/SEK plan) — see PistonClient.cs's doc comment.
  # Confirmed working end-to-end on this class of host (cgroup v2, no isolate/cgroup v1
  # dependency the way judge0-server/judge0-workers below have) during the 0.1 spike:
  # real package install + real execution, correct output. `--privileged` matches
  # Piston's own reference deployment docs — it sandboxes each execution itself
  # (nsjail-based), this is not the same "judge0 needs host-privileged isolate" tradeoff
  # documented on judge0-server below.
  piston:
    image: ghcr.io/engineer-man/piston
    container_name: campus-piston
    restart: unless-stopped
    privileged: true
    ports:
      - "127.0.0.1:2000:2000" # loopback-only; backend-api reaches it over the compose network
    volumes:
      - campus-piston-packages:/piston
    # Container-level ceiling (#138) — same rationale as judge0-server/workers below:
    # this runs untrusted student code, don't rely on Piston's own defaults alone.
    mem_limit: 1.5g
    cpus: 1.5
    pids_limit: 512

  authz:
    image: openfga/openfga:latest
    container_name: campus-authz
    restart: unless-stopped
    environment:
      OPENFGA_AUTHN_METHOD: preshared
      # Required — no default. Without this, any container on the compose network
      # (backend-api, ai-services, or anything that compromises one of them) could
      # read/write arbitrary authorization tuples on authz:8080 with no credential
      # and no audit trail (#133). Mirrors the JWT_SIGNING_KEY fail-fast pattern
      # used for backend-api above. Set OPENFGA_PRESHARED_KEY in the shell/.env
      # before `docker compose up`; clients must send it as
      # `Authorization: Bearer <key>` (see services/authz/README.md).
      OPENFGA_AUTHN_PRESHARED_KEYS: ${OPENFGA_PRESHARED_KEY:?Set OPENFGA_PRESHARED_KEY before starting authz}
    # --playground-enabled is incompatible with preshared auth (OpenFGA panics
    # at startup: "the playground only supports authn method 'none'") — dropped
    # rather than relaxing OPENFGA_AUTHN_METHOD, since the preshared key is the
    # security-load-bearing part (#133), not the playground UI.
    command: run --datastore-engine memory
    ports:
      - "127.0.0.1:8081:8080" # HTTP API — loopback-only, not for external access
    healthcheck:
      # openfga's image (cgr.dev/chainguard/static) is distroless — no shell, no
      # curl/wget. The only probe binary it ships is grpc_health_probe, which
      # upstream's own Dockerfile uses against the gRPC listener (container-internal
      # port 8081, unrelated to the host port mapping above) for exactly this
      # purpose — it backs the same grpc.health.v1.Health check that /healthz
      # answers over HTTP, so this is the practical equivalent of probing
      # /healthz from inside the container. A manual
      # `curl http://localhost:8081/healthz` from the host still works too.
      test: ["CMD", "grpc_health_probe", "-addr=:8081"]
      interval: 5s
      timeout: 5s
      retries: 5

  judge0-db:
    image: postgres:16-alpine
    container_name: campus-judge0-db
    restart: unless-stopped
    environment:
      POSTGRES_DB: judge0
      POSTGRES_USER: judge0
      # Hardcoded dev-only credential (#137). Not env-var-templated like the main
      # postgres/authz services above: this password must stay byte-for-byte
      # identical to POSTGRES_PASSWORD in services/code-execution/judge0.conf,
      # which judge0.conf's flat key=value format can't pull from a shell/.env
      # var at container-init time the way docker-compose.yml can. No port is
      # published (internal-network-only, reachable only by judge0-server/workers)
      # which limits the blast radius, but rotate this — and the matching value
      # in judge0.conf — together before any non-dev deploy.
      POSTGRES_PASSWORD: judge0_dev
    volumes:
      - campus-judge0-db-data:/var/lib/postgresql/data

  judge0-redis:
    image: redis:7-alpine
    container_name: campus-judge0-redis
    restart: unless-stopped
    # Hardcoded dev-only credential (#137), same constraint as judge0-db above:
    # must match REDIS_PASSWORD in services/code-execution/judge0.conf exactly.
    # Internal-network-only (no published port). Rotate both together before
    # any non-dev deploy.
    command: ["redis-server", "--requirepass", "judge0_redis_dev"]

  # STATUS (2026-07-30, 0.1/B1 spike): kept in place but NOT what's actually wired into
  # backend-api's RemoteCodeRunner — see `piston` above. The Redis-connectivity bug that
  # blocked judge0-workers is now understood and fixed (see judge0.conf's own "RESOLVED"
  # log entry — it was CRLF line endings corrupting env vars, plus an unrelated Docker
  # embedded-DNS flake), but the deeper blocker isn't fixable from this file: isolate
  # (judge0-server/workers' actual sandbox) requires cgroup v1, and hosts in this class
  # (WSL2/Docker Desktop, and likely most modern distros) are cgroup v2-only — confirmed
  # directly (`Failed to create control group /sys/fs/cgroup/memory/box-N/`). Piston
  # doesn't share that dependency and was confirmed working end-to-end on the same host.
  # Left running rather than removed, same rationale campus-backend/CLAUDE.md already
  # documented for the pre-fix state — nothing depends on deleting it, and the fixed
  # Redis config is worth keeping in case a cgroup v1-capable host is used later.
  #
  # Code Execution Service (CEX) — runs untrusted student code (SEK-01).
  # Both containers below run `privileged: true`. This matches Judge0's own
  # reference docker-compose: isolate's cgroup/namespace sandboxing needs it
  # even on judge0-server's synchronous (wait=true) request path, not just
  # in judge0-workers. That's a real, deliberate privilege-escalation this
  # stack accepts — it's contained by everything else here: no port is
  # published on judge0-workers (unreachable from the host or any other
  # service), judge0-server's port is loopback-only, and every submission
  # is bound by judge0.conf's hard resource ceilings and
  # ENABLE_NETWORK=false, so even with host-level privileges available to
  # the *container*, a submission running inside an isolate box still can't
  # reach the network, exceed its CPU/memory/process limits, or persist
  # beyond its box.
  judge0-server:
    image: judge0/judge0:1.13.1
    container_name: campus-judge0-server
    restart: unless-stopped
    # SECURITY-LOAD-BEARING (#95): required for isolate's sandboxing, mitigated by
    # everything documented in the block comment above (loopback-only port,
    # judge0.conf's resource ceilings, ENABLE_NETWORK=false). Do NOT flip this to
    # `false` "temporarily for debugging" and forget to revert it — and do not
    # relax it without re-reviewing the mitigations, since without them this is a
    # full host-privileged sandbox escape waiting to happen for whoever can reach
    # this container.
    privileged: true
    # judge0.conf is a flat KEY=VALUE file (Judge0's own documented config format),
    # which only takes effect when docker-compose loads it as the container's
    # environment via env_file — mounting it as a plain volume (the previous config)
    # leaves the file sitting at /judge0.conf unread, so REDIS_HOST/REDIS_PASSWORD/etc.
    # never reach the process and every submission fails with Redis::CannotConnectError.
    # Keep the read-only volume mount too so /judge0.conf is still present on disk for
    # anything (docs, manual inspection) that expects to find it.
    env_file:
      - ./services/code-execution/judge0.conf
    volumes:
      - ./services/code-execution/judge0.conf:/judge0.conf:ro
    ports:
      - "127.0.0.1:2358:2358" # loopback-only; backend-api reaches it over the compose network
    depends_on:
      - judge0-db
      - judge0-redis
    # Container-level ceiling (#138): judge0.conf's MAX_MEMORY_LIMIT=256000 (~250MB)
    # and MAX_PROCESSES_AND_OR_THREADS=60 are per-submission caps, not an aggregate
    # one — a burst of concurrent requests on the synchronous (wait=true) path could
    # otherwise each stay within their own ceiling while exhausting the host in
    # aggregate. Sized for a handful of concurrent synchronous requests plus isolate
    # overhead, not just one.
    mem_limit: 1.5g
    cpus: 1.5
    pids_limit: 512

  judge0-workers:
    image: judge0/judge0:1.13.1
    container_name: campus-judge0-workers
    restart: unless-stopped
    command: ["./scripts/workers"]
    # SECURITY-LOAD-BEARING (#95): see judge0-server above — same isolate
    # sandboxing requirement, same mitigations, same warning: never relax this
    # "temporarily" and leave it relaxed.
    privileged: true
    env_file:
      - ./services/code-execution/judge0.conf
    volumes:
      - ./services/code-execution/judge0.conf:/judge0.conf:ro
    depends_on:
      - judge0-db
      - judge0-redis
    # Container-level ceiling (#138): this is where actual submission execution
    # happens (MAX_QUEUE_SIZE=100 in judge0.conf), so it needs headroom for
    # several submissions running concurrently, each up to the per-submission
    # ceilings above — not just one submission's worth of memory/PIDs.
    mem_limit: 3g
    cpus: 2.0
    pids_limit: 1024

volumes:
  campus-pg-data:
  campus-judge0-db-data:
  campus-backend-keys:
  campus-piston-packages:
