services:
  mssql:
    image: mcr.microsoft.com/mssql/server:2022-latest
    container_name: campus-mssql
    restart: unless-stopped
    environment:
      ACCEPT_EULA: "Y"
      MSSQL_PID: Developer
      # Required — no default. Mirrors the JWT_SIGNING_KEY fail-fast pattern below: set
      # MSSQL_SA_PASSWORD in the shell/.env before `docker compose up` (see .env.example).
      # Also read by db/init/03_create_app_role.sql (via mssql-init below) to provision the
      # least-privilege campus_app login (#137).
      MSSQL_SA_PASSWORD: ${MSSQL_SA_PASSWORD:?Set MSSQL_SA_PASSWORD before starting mssql}
    ports:
      - "1433:1433"
    volumes:
      - campus-mssql-data:/var/opt/mssql
    healthcheck:
      test: ["CMD-SHELL", "/opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -P \"$$MSSQL_SA_PASSWORD\" -C -No -Q 'SELECT 1' || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 10

  # Migrated off the postgres image (which auto-applied db/init/*.sql via its own
  # docker-entrypoint-initdb.d on first boot) — mcr.microsoft.com/mssql/server has no
  # equivalent auto-init mechanism, so this one-shot sidecar applies the same files via
  # sqlcmd once `mssql` reports healthy, then exits. Re-running `docker compose up` is safe:
  # every file under db/init/ is itself idempotent (IF NOT EXISTS guards).
  mssql-init:
    image: mcr.microsoft.com/mssql-tools18:latest
    container_name: campus-mssql-init
    depends_on:
      mssql:
        condition: service_healthy
    environment:
      MSSQL_SA_PASSWORD: ${MSSQL_SA_PASSWORD:?Set MSSQL_SA_PASSWORD before starting mssql}
      # Dev-only default documented in .env.example; rotate before any non-dev deploy. See
      # db/init/03_create_app_role.sql (#137).
      MSSQL_APP_PASSWORD: ${MSSQL_APP_PASSWORD:-campus_app_dev}
    volumes:
      # db/init lives in campus-backend post-split (repo-split-plan.md §2 Tier 1:
      # `campus-backend` = `services/backend-api/` + `db/`) — sibling clone, per
      # INTEGRATIONS.md's bootstrap flow.
      - ../campus-backend/db/init:/init:ro
    entrypoint: ["/bin/bash", "-c"]
    command:
      - |
        set -e
        for f in /init/*.sql; do
          echo "Applying $$f";
          /opt/mssql-tools18/bin/sqlcmd -S mssql -U sa -P "$$MSSQL_SA_PASSWORD" -C -No \
            -v APP_PASSWORD="$$MSSQL_APP_PASSWORD" -i "$$f";
        done
    restart: "no"
  ai-services:
    build:
      # Sibling clone of campus-ai-services, per INTEGRATIONS.md's bootstrap flow
      # (repo-split-plan.md §2 Tier 1) — not a subdirectory of this repo.
      context: ../campus-ai-services
      dockerfile: Dockerfile
      target: runner
    container_name: campus-ai-services
    restart: unless-stopped
    ports:
      - "8000:8000"
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request; urllib.request.urlopen('http://localhost:8000/')\""]
      interval: 10s
      timeout: 5s
      retries: 5
    # Defense-in-depth container ceiling (#138) — not sized for a specific
    # model workload, just a backstop against one runaway process consuming
    # the whole host. Raise if a real model-serving workload needs more.
    mem_limit: 1g
    cpus: 1.0
    pids_limit: 256

  # Dev/CI-only image with pytest + tests/ baked in — not used at runtime.
  # Run tests with: docker compose run --rm ai-services-test pytest
  ai-services-test:
    build:
      context: ../campus-ai-services
      dockerfile: Dockerfile
      target: test
    profiles: ["test"]

  backend-api:
    build:
      # Sibling clone of campus-backend, per INTEGRATIONS.md's bootstrap flow
      # (repo-split-plan.md §2 Tier 1) — not a subdirectory of this repo.
      context: ../campus-backend
    container_name: campus-backend-api
    restart: unless-stopped
    environment:
      # Cut over to the least-privilege campus_app login (#137) provisioned by
      # db/init/03_create_app_role.sql instead of the sa admin login — backend-api
      # only ever does row-level CRUD, never DDL/role/database administration.
      # MSSQL_APP_PASSWORD is required (see mssql-init service above) and reused
      # here so the two never drift. Program.cs also fails fast outside Development
      # if this still resolves to the committed appsettings.json dev placeholder.
      ConnectionStrings__Campus: "Server=mssql,1433;Database=campus;User Id=campus_app;Password=${MSSQL_APP_PASSWORD:-campus_app_dev};TrustServerCertificate=true"
      # Required in non-Development environments — backend-api fails fast at startup if unset.
      # Set JWT_SIGNING_KEY in the shell/.env before `docker compose up`; never commit a real value.
      Jwt__Key: ${JWT_SIGNING_KEY:?Set JWT_SIGNING_KEY before starting backend-api}
      AiServices__BaseUrl: "http://ai-services:8000"
      # AIS-02: Copyleaks credentials — sourced from the host/CI environment (or a
      # gitignored .env file), never hardcoded here. Left unset, backend-api's
      # plagiarism-check endpoint fails closed with a 503 rather than crashing.
      Copyleaks__Email: "${COPYLEAKS_EMAIL:-}"
      Copyleaks__ApiKey: "${COPYLEAKS_API_KEY:-}"
      Copyleaks__WebhookSecret: "${COPYLEAKS_WEBHOOK_SECRET:-}"
      # AIS-05: Pangram credentials — same fail-closed-503 pattern as Copyleaks above.
      Pangram__ApiKey: "${PANGRAM_API_KEY:-}"
    ports:
      - "8080:8080"
    volumes:
      # #131: Data Protection key ring (encrypts TOTP secrets at rest). Must persist across
      # restarts/redeploys — without this, every existing user's TotpSecret would become
      # undecryptable (and thus unusable for login) the moment the container is recreated.
      - campus-backend-keys:/keys
    depends_on:
      mssql:
        condition: service_healthy
      # Requires Docker Compose v2.20+ / Compose Spec with service_completed_successfully
      # support — waits for the one-shot schema-init sidecar to actually finish applying
      # db/init/*.sql, not just for `mssql` itself to accept connections (which alone doesn't
      # mean the `campus` database/schema/app login exist yet). On an older Compose that
      # doesn't support this condition, run `docker compose up mssql-init` to completion
      # manually before starting backend-api.
      mssql-init:
        condition: service_completed_successfully
      authz:
        condition: service_healthy
      ai-services:
        condition: service_healthy
    # Defense-in-depth container ceiling (#138).
    mem_limit: 1g
    cpus: 1.0
    pids_limit: 256

  authz:
    image: openfga/openfga:latest
    container_name: campus-authz
    restart: unless-stopped
    environment:
      OPENFGA_AUTHN_METHOD: preshared
      # Required — no default. Without this, any container on the compose network
      # (backend-api, ai-services, or anything that compromises one of them) could
      # read/write arbitrary authorization tuples on authz:8080 with no credential
      # and no audit trail (#133). Mirrors the JWT_SIGNING_KEY fail-fast pattern
      # used for backend-api above. Set OPENFGA_PRESHARED_KEY in the shell/.env
      # before `docker compose up`; clients must send it as
      # `Authorization: Bearer <key>` (see services/authz/README.md).
      OPENFGA_AUTHN_PRESHARED_KEYS: ${OPENFGA_PRESHARED_KEY:?Set OPENFGA_PRESHARED_KEY before starting authz}
    # --playground-enabled is incompatible with preshared auth (OpenFGA panics
    # at startup: "the playground only supports authn method 'none'") — dropped
    # rather than relaxing OPENFGA_AUTHN_METHOD, since the preshared key is the
    # security-load-bearing part (#133), not the playground UI.
    command: run --datastore-engine memory
    ports:
      - "127.0.0.1:8081:8080" # HTTP API — loopback-only, not for external access
    healthcheck:
      # openfga's image (cgr.dev/chainguard/static) is distroless — no shell, no
      # curl/wget. The only probe binary it ships is grpc_health_probe, which
      # upstream's own Dockerfile uses against the gRPC listener (container-internal
      # port 8081, unrelated to the host port mapping above) for exactly this
      # purpose — it backs the same grpc.health.v1.Health check that /healthz
      # answers over HTTP, so this is the practical equivalent of probing
      # /healthz from inside the container. A manual
      # `curl http://localhost:8081/healthz` from the host still works too.
      test: ["CMD", "grpc_health_probe", "-addr=:8081"]
      interval: 5s
      timeout: 5s
      retries: 5

  # judge0-db/judge0-redis/judge0-server/judge0-workers (the Code Execution Service, SEK-01)
  # removed — campus-backend#91ab918 replaced Judge0 with Services/DockerCodeRunner.cs
  # (shells out to `docker run` directly), leaving judge0-* running but unused ("left in place
  # rather than removed as part of this change, since nothing here depends on deleting them" —
  # see that commit and campus-backend/CLAUDE.md's SEK-01 section). judge0-db was the last
  # Postgres instance left on this platform once campus-backend's own DB moved to SQL Server
  # (see mssql/mssql-init above), so removing this dead stack was necessary to actually finish
  # that migration, not unrelated cleanup. services/code-execution/judge0.conf is left in place
  # (unread now, same as the commit above left the images running unused) — deleting it wasn't
  # required for this change and is a smaller, separate cleanup if anyone wants Judge0's
  # remnants fully gone from the repo, not just from the running stack.

volumes:
  campus-mssql-data:
  campus-backend-keys:
